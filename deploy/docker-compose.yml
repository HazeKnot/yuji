services:
  mysql:
    image: mysql:8.0
    container_name: yuji-mysql
    environment:
      MYSQL_ROOT_PASSWORD: yuji123
      MYSQL_DATABASE: yuji
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      # 宿主机已有 MySQL 占用 3306 时，可用环境变量改映射：set MYSQL_HOST_PORT=3307
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-pyuji123" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: yuji-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: yuji-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: yujiadmin
      MINIO_ROOT_PASSWORD: yuji12345678
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # 后端：docker compose --profile app up -d --build
  backend:
    profiles: [ "app" ]
    build:
      context: ../backend
    container_name: yuji-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: yuji123
      JWT_SECRET: yuji-local-demo-secret-please-change-me-0123456789
      # local = 容器卷存文件；minio = 走下面的对象存储（改一行即可切换）
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_DIR: /app/data/uploads
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: yujiadmin
      MINIO_SECRET_KEY: yuji12345678
      MINIO_BUCKET: yuji-reports
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  minio-data:
  uploads:
