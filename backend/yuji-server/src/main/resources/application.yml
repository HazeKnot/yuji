server:
  port: 8080

spring:
  application:
    name: yuji-server
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/yuji?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:yuji123}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      # 与 ReportService.MAX_SIZE 保持一致（10MB），留 2MB 给表单其它字段
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

yuji:
  jwt:
    # 生产环境必须通过环境变量覆盖（HMAC-SHA256 要求密钥 >= 32 字符）
    secret: ${JWT_SECRET:yuji-dev-secret-please-change-me-0123456789abcdef}
    expire-days: 7
  storage:
    # local：磁盘（默认，clone 即跑）；minio：对象存储（docker compose 里有 MinIO 服务）
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      # 与 deploy/docker-compose.yml 的 MinIO 服务保持一致
      access-key: ${MINIO_ACCESS_KEY:yujiadmin}
      secret-key: ${MINIO_SECRET_KEY:yuji12345678}
      bucket: ${MINIO_BUCKET:yuji-reports}

logging:
  level:
    com.yuji: info

management:
  endpoints:
    web:
      exposure:
        include: health
